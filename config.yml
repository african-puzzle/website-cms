logo:
  src: https://africanpuzzle.com/images/logo-bright.svg
  show_in_header: true

backend:
  name: github
  repo: african-puzzle/website-frontend
  branch: main
  base_url: https://sveltia-cms-auth.proverb-drinker9c.workers.dev

site_url: https://africanpuzzle.com
display_url: https://africanpuzzle.com

media_folder: public/images
public_folder: /images

collections:
  - name: team
    label: Team Members
    label_singular: Team Member
    summary: "{{name}} — {{role.en}}"
    folder: src/content/team
    create: true
    extension: md
    format: yaml-frontmatter
    sortable_fields: ['order', 'name']
    fields:
      - { label: Name, name: name, widget: string }
      - label: Role
        name: role
        widget: object
        fields:
          - { label: French, name: fr, widget: string }
          - { label: English, name: en, widget: string }
          - { label: Pidgin, name: pcm, widget: string }
      - label: LinkedIn URL
        name: linkedin
        widget: string
        required: false
        default: ''
        hint: "Full LinkedIn profile URL, e.g. https://linkedin.com/in/username"
        pattern: ['^(https?://(www\.)?linkedin\.com/.*)?$', 'Must be a valid LinkedIn URL or empty']
      - { label: Photo, name: photo, widget: image, required: false, default: '' }
      - label: Display Order
        name: order
        widget: number
        value_type: int
        hint: "Lower numbers appear first on the page"

  - name: media
    label: Media Coverage
    label_singular: Media Item
    summary: "{{title}} ({{category}}, {{date}})"
    folder: src/content/media
    create: true
    extension: md
    format: yaml-frontmatter
    sortable_fields: ['date', 'title']
    view_filters:
      - { label: 'Radio & Podcasts', field: category, pattern: radio }
      - { label: 'Press Releases', field: category, pattern: press-release }
      - { label: 'Articles', field: category, pattern: articles }
      - { label: 'Videos', field: category, pattern: videos }
      - { label: 'Social Mentions', field: category, pattern: social }
    view_groups:
      - { label: 'By Category', field: category }
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text, required: false, default: '' }
      - { label: Date, name: date, widget: datetime, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - label: Category
        name: category
        widget: select
        options:
          - { label: 'Radio & Podcasts', value: radio }
          - { label: 'Press Release', value: press-release }
          - { label: 'Articles', value: articles }
          - { label: 'Videos', value: videos }
          - { label: 'Social Mention', value: social }
      - { label: Image, name: image, widget: image }
      - label: Link
        name: link
        widget: string
        hint: "URL to the original article, video, or media source"

  - name: features
    label: Features
    label_singular: Feature
    summary: "{{titleKey}} (order: {{order}})"
    folder: src/content/features
    create: true
    extension: md
    format: yaml-frontmatter
    fields:
      - label: Title i18n Key
        name: titleKey
        widget: string
        hint: "i18n key for the feature title (e.g. features.programmes_title)"
      - label: Description i18n Key
        name: descKey
        widget: string
        hint: "i18n key for the feature description (e.g. features.programmes_desc)"
      - label: App Screenshot
        name: screen
        widget: image
        hint: "Phone screenshot shown in the feature card (WebP, in /images/app/)"
      - label: Card Background Class
        name: cardBg
        widget: select
        hint: "Background color for this feature card"
        options:
          - { label: 'Programmes', value: 'bg-feature-programmes' }
          - { label: 'Contacts', value: 'bg-feature-contacts' }
          - { label: 'Measurements', value: 'bg-feature-measurements' }
          - { label: 'Album', value: 'bg-feature-album' }
          - { label: 'Appointments', value: 'bg-feature-appointments' }
          - { label: 'Collaborators', value: 'bg-feature-collab' }
      - { label: Display Order, name: order, widget: number, value_type: int }

  - name: countries
    label: Countries
    files:
      - name: countries
        label: Countries List
        file: src/content/countries/countries.json
        fields:
          - label: Countries
            name: countries
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Emoji Flag, name: emoji, widget: string }
              - { label: French Name, name: fr, widget: string }
              - { label: English Name, name: en, widget: string }
              - { label: Pidgin Name, name: pcm, widget: string }

  - name: site-settings
    label: Site Settings
    files:
      - name: site
        label: General Settings
        file: src/content/settings/site.json
        fields:
          - label: Play Store URL
            name: playStoreUrl
            widget: string
            pattern: ['^https://play\.google\.com/store/apps/details\?id=.*$', 'Must be a valid Google Play Store URL']
          - label: YouTube Video ID
            name: youtubeVideoId
            widget: string
            hint: "The 11-character ID from the YouTube URL (e.g. dQw4w9WgXcQ)"
          - { label: App launched, name: launched, widget: boolean, default: false, hint: "On: the homepage shows the Google Play badge instead of 'Contact us'" }
          - { label: Instagram handle, name: instagramHandle, widget: string }
          - { label: Instagram URL, name: instagramUrl, widget: string }
      - name: instagram
        label: Instagram Feed
        file: src/content/settings/instagram.json
        fields:
          - label: Posts
            name: posts
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Image, name: image, widget: image }
              - { label: Instagram Link, name: link, widget: string }
              - { label: Display Order, name: order, widget: number, value_type: int }

      - name: about-page
        label: About Page
        file: src/content/settings/about-page.json
        fields:
          - label: Hero Image
            name: heroImage
            widget: image
            hint: "The large background image at the top of the About page"

  - name: contact
    label: Contact
    files:
      - name: contact
        label: Contact
        file: src/content/contact/contact.json
        fields:
          - label: Contact Methods
            name: contact_methods
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - label: Icon
                name: icon
                widget: select
                options:
                  - { label: WhatsApp, value: whatsapp }
                  - { label: Facebook, value: facebook }
                  - { label: Instagram, value: instagram }
                  - { label: Telegram, value: telegram }
                  - { label: Twitter, value: twitter }
                  - { label: LinkedIn, value: linkedin }
                  - { label: YouTube, value: youtube }
                  - { label: Email, value: email }
                  - { label: Phone, value: phone }
                  - { label: Address, value: address }
                  - { label: Website, value: website }
              - { label: Value, name: value, widget: text, hint: "Phone number, handle, URL, or address" }
              - { label: Link URL, name: url, widget: string, required: false, default: '', hint: "Optional clickable link (tel:, mailto:, or https://)" }
              - { label: Display Order, name: order, widget: number, value_type: int }
              - { label: Show in footer, name: showInFooter, widget: boolean, default: false }
              - { label: Show on contact page, name: showInContact, widget: boolean, default: false }

  - name: privacy
    label: Privacy Policy
    label_singular: Privacy Policy
    summary: "{{title}} — {{locale}}"
    folder: src/content/privacy
    create: true
    extension: md
    format: yaml-frontmatter
