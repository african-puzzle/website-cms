name: Slack merge notification

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    # Runs only on a real merge, not on a PR closed without merging.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_MERGE_WEBHOOK }}
          # Untrusted values (title, author, branch) go through the environment and
          # are never interpolated into the script: this blocks injection via a PR title.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_MERGE_WEBHOOK not set; skipping notification."
            exit 0
          fi
          jq -n \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg num "$PR_NUMBER" \
            --arg author "$PR_AUTHOR" \
            --arg base "$PR_BASE" \
            '{text: ("Merged into " + $base + ": <" + $url + "|#" + $num + " " + $title + "> by " + $author)}' \
            > payload.json
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data @payload.json "$SLACK_WEBHOOK_URL"
